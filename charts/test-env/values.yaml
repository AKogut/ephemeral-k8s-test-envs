# Default values for the test-env chart.
#
# The chart installs into whatever namespace Helm is pointed at:
#
#   helm install pr-123 ./charts/test-env \
#     --namespace pr-123 --create-namespace \
#     --set image.tag=$GITHUB_SHA
#
# The namespace is not templated as a resource on purpose — see
# docs/adr/0001-namespace-per-environment.md.

# -- Identifier echoed by every service on `x-env-id`. Defaults to the release
# namespace, which is what makes a running pod traceable back to the PR that
# created it.
envId: ""

nameOverride: ""
fullnameOverride: ""

# -- Labels added to every object the chart creates.
commonLabels: {}
commonAnnotations: {}

image:
  registry: ghcr.io
  # -- Owner/repo prefix. Images are <registry>/<namespace>/<component>:<tag>.
  namespace: akogut/ephemeral-k8s-test-envs
  # -- Defaults to .Chart.AppVersion. In CI this is the commit SHA, which is what
  # guarantees a PR environment runs that PR's code and nothing else.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Signing key shared by auth-service (issuer) and notes-service (verifier).
# Left empty, the chart generates a random key per release and keeps it stable
# across upgrades. Never set a real secret through --set in CI; use a
# pre-existing Secret via existingSecret instead.
jwt:
  secret: ""
  existingSecret: ""
  existingSecretKey: jwt-secret
  issuer: ephemeral-test-envs/auth-service
  audience: ephemeral-test-envs
  ttlSeconds: 3600

# ------------------------------------------------------------------ services --

auth:
  replicaCount: 1
  component: auth-service
  port: 3001
  # -- log2 of the scrypt cost. 14 is the production figure; 12 keeps a test
  # suite from spending most of its time hashing throwaway passwords.
  scryptCostLog2: 12
  logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- SQLite lives on an emptyDir: the data is as ephemeral as the environment,
  # and a PVC would only add a scheduling constraint.
  storage:
    sizeLimit: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

notes:
  replicaCount: 1
  component: notes-service
  port: 3002
  # -- jwt-only | verify-with-auth-service
  # The default makes notes-service call auth-service over cluster DNS on the
  # first use of each token, so the deployment exercises a real service-to-service
  # hop rather than two unrelated pods in one namespace.
  authMode: verify-with-auth-service
  authVerifyTimeoutMs: 2000
  authCacheTtlMs: 5000
  maxPageSize: 100
  logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  storage:
    sizeLimit: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  # -- The only stateless service, so it is the one that demonstrates replicas.
  # auth and notes stay at 1 because they own node-local SQLite files; see
  # docs/adr/0006-single-replica-data-services.md.
  replicaCount: 2
  component: gateway
  port: 3000
  proxyTimeoutMs: 10000
  readinessTimeoutMs: 2000
  logLevel: info
  service:
    type: ClusterIP
    port: 80
    nodePort: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------- tests --

tests:
  # -- Set to false to stand up the environment without running anything, which
  # is what `local-demo.sh --no-tests` does before handing over a port-forward.
  enabled: true
  component: api-tests

  # -- Number of parallel shard pods. Each pod derives its own slice from
  # JOB_COMPLETION_INDEX; nothing is coordinated at runtime.
  shards: 4
  # -- Playwright workers *inside* each pod. Total concurrency is shards × workers.
  workers: 2
  retries: 1

  # -- 0 means a failing shard is a failing shard: no pod-level retry masking a
  # real failure. Flakiness is handled by Playwright's own `retries` instead,
  # which records the retry in the report.
  backoffLimit: 0
  # -- Finished shard pods clean themselves up even if nothing else does. This is
  # pod hygiene, not environment cleanup — see docs/cost-and-cleanup.md.
  ttlSecondsAfterFinished: 900
  activeDeadlineSeconds: 1800

  readyTimeoutMs: 180000
  testTimeoutMs: 30000

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Where per-shard results go: object storage, reached over the network,
  # so nothing about the results decides which node a shard may run on.
  # See ADR 0007.
  results:
    # Scratch space inside each pod. A shard writes here and then uploads; the
    # aggregator downloads the run into the same place before merging.
    size: 1Gi

    s3:
      # Left empty while minio.enabled, the chart points this at the MinIO it
      # deploys. Set it to use a bucket that already exists instead.
      endpoint: ""
      bucket: results
      region: us-east-1
      # MinIO has no per-bucket DNS, so path style is the in-cluster default.
      forcePathStyle: true
      # Whether the uploader may create the bucket. True for the throwaway
      # MinIO; against a real bucket the credentials usually cannot, and the
      # bucket is already there.
      createBucket: true
      # A Secret holding `access-key-id` and `secret-access-key`. Generated per
      # release when empty, the same way the JWT signing key is.
      existingSecret: ""

# ---------------------------------------------------------------------- minio -

# -- Object storage for results, inside the environment.
#
# Turn this off only when tests.results.s3.endpoint points at a bucket that
# already exists. The chart refuses to render with neither, because the results
# would have nowhere to go.
#
# A single pod on an emptyDir: the results live and die with the namespace, so
# there is nothing here worth persisting. The point is not durability — it is
# that every shard reaches it *over the network* rather than through a mounted
# volume, which is what stops the storage dictating where pods run.
minio:
  enabled: true
  component: minio
  image:
    repository: quay.io/minio/minio
    # Pinned: storage that changes under the tests would make a real regression
    # and an upstream change produce the same failure.
    tag: RELEASE.2025-09-07T16-13-09Z
    pullPolicy: IfNotPresent
  storage:
    sizeLimit: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ---------------------------------------------------------------- aggregator --

aggregator:
  enabled: true
  component: aggregator
  # -- Waits for the shard Job through the Kubernetes API using the pod's own
  # service account, so no kubectl image is needed.
  waitTimeoutSeconds: 900
  waitIntervalSeconds: 5
  ttlSecondsAfterFinished: 900
  backoffLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ------------------------------------------------------------- resource quota --

# -- A ceiling on what one environment may take from a shared cluster.
#
# Per-pod limits stop one container running away; they say nothing about the
# total. `tests.shards` is a value, and 32 shard pods install perfectly happily —
# the pods left Pending are then somebody else's pull request. See issue #83.
#
# The quota is summed from what the release actually declares, so raising the
# shard count raises the quota with it rather than colliding with it.
resourceQuota:
  enabled: true
  # Applied to the computed CPU and memory totals. Covers rounding, a rolling
  # update overlapping two pods, and a Job retry.
  headroomPercent: 20
  # Extra pods on top of the count the release declares, for the same reasons.
  podHeadroom: 4
  # Used by the LimitRange for containers that declare nothing. Nothing in this
  # chart relies on them — with a quota in force, a pod without requests is
  # rejected outright, so these exist to keep the next workload from failing in
  # a way that reads as a quota problem rather than a missing resources block.
  containerDefaults:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ------------------------------------------------------------------ teardown --

teardown:
  # -- Second line of defence. The primary teardown is the explicit
  # `helm uninstall` + `kubectl delete namespace` step in CI; this Job covers the
  # case where the pipeline dies before reaching it — a cancelled workflow, a
  # runner that is killed. Off by default because it would delete a namespace
  # out from under someone using local-demo.sh interactively.
  selfDestruct:
    enabled: false
    afterSeconds: 3600
    ttlSecondsAfterFinished: 300
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# --------------------------------------------------------------------- misc --

serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Applied to every pod in the chart.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}

# -- A default-deny NetworkPolicy plus the specific flows this stack needs.
# Off by default because kind ships without a policy-enforcing CNI, so enabling
# it there would give a false sense of security rather than actual isolation.
networkPolicy:
  enabled: false
