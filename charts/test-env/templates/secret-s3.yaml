{{- if and .Values.tests.enabled (eq (include "test-env.resultsOnS3" .) "true") (not .Values.tests.results.s3.existingSecret) }}
{{/*
Credentials for the results bucket.

Same resolution as the JWT key, and for the same reason: the `lookup` keeps the
value already in the cluster, so `helm upgrade` does not hand the clients new
keys while MinIO is still serving with the old ones — which would surface as
403s on upload and read as "the results vanished".

`existingSecret` is the way to point an environment at a real bucket, where the
credentials come from somewhere else entirely.
*/}}
{{- $secretName := printf "%s-s3" (include "test-env.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $accessKey := "" -}}
{{- $secretKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "access-key-id") -}}
  {{- $accessKey = index $existing.data "access-key-id" | b64dec -}}
  {{- $secretKey = index $existing.data "secret-access-key" | b64dec -}}
{{- else -}}
  {{/*
    The prefix is fixed rather than left to chance, and it may not be "env".

    MinIO rejects a root user whose value begins with a lowercase "env" — it
    reads such a value as a reference to be resolved elsewhere rather than as
    the credential itself. What it reports is `Missing credential environment
    variable, "MINIO_ROOT_USER"`, which is true from its point of view and
    describes the wrong problem entirely: the variable is set, and every part of
    the wiring around it is correct.

    Verified in-cluster: `envABCDEFGHIJKLMNOPQ` fails, `xyzLzkV3YYk4rLA3A4e9`
    and `ENVabcdefghijklmnopq` both start normally.

    A bare randAlphaNum would produce that prefix roughly once in 240,000
    installs, which is worse than never — an intermittent failure whose message
    points somewhere else.
  */}}
  {{- $accessKey = printf "test%s" (randAlphaNum 16) -}}
  {{- $secretKey = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "test-env.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ $accessKey | quote }}
  secret-access-key: {{ $secretKey | quote }}
{{- end }}
