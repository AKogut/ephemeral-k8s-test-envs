{{- if and .Values.tests.enabled (not .Values.tests.results.s3.existingSecret) }}
{{/*
Credentials for the results bucket.

Same resolution as the JWT key, and for the same reason: the `lookup` keeps the
value already in the cluster, so `helm upgrade` does not hand the clients new
keys while the object store is still serving with the old ones — which would
surface as 403s on upload and read as "the results vanished".

`existingSecret` is the way to point an environment at a real bucket, where the
credentials come from somewhere else entirely.
*/}}
{{- $secretName := printf "%s-s3" (include "test-env.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $accessKey := "" -}}
{{- $secretKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "access-key-id") -}}
  {{- $accessKey = index $existing.data "access-key-id" | b64dec -}}
  {{- $secretKey = index $existing.data "secret-access-key" | b64dec -}}
{{- else -}}
  {{- $accessKey = randAlphaNum 20 -}}
  {{- $secretKey = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "test-env.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ $accessKey | quote }}
  secret-access-key: {{ $secretKey | quote }}
{{- end }}
