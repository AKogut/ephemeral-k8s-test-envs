{{- if not .Values.jwt.existingSecret }}
{{/*
The JWT signing key.

Resolution order:
  1. an explicit .Values.jwt.secret
  2. the value already stored in the cluster (so `helm upgrade` does not
     invalidate every token and roll all three deployments)
  3. a freshly generated random key

Point 2 is the reason for the `lookup`: without it, every redeploy of a PR
environment would mint a new key, and any test holding a token from before the
upgrade would start failing for reasons unrelated to the code under test.
*/}}
{{- $secretName := printf "%s-jwt" (include "test-env.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := .Values.jwt.secret -}}
{{- if not $value -}}
  {{- if and $existing $existing.data (index $existing.data "jwt-secret") -}}
    {{- $value = index $existing.data "jwt-secret" | b64dec -}}
  {{- else -}}
    {{- $value = randAlphaNum 48 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "test-env.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ $value | quote }}
{{- end }}
