{{- if and .Values.tests.enabled .Values.minio.enabled (eq (include "test-env.resultsOnS3" .) "true") }}
{{/*
Object storage for this environment's results.

One replica on an emptyDir, and both are deliberate. The results live for the
length of a pull request and are copied out before the namespace goes, so there
is nothing here worth persisting — a PersistentVolume would only re-introduce
the thing this replaces.

What matters is the *access path*, not the durability. A shared ReadWriteOnce
volume attaches to one node and therefore decides where every shard pod runs.
A Service does not: a pod on any node reaches this over the network, which is
what lets the shard Job spread across a cluster.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "test-env.minioServiceName" . }}
  labels:
    {{- include "test-env.componentLabels" (dict "context" . "component" .Values.minio.component) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Recreate rather than RollingUpdate: two MinIO pods would each have their
    # own emptyDir, and a shard uploading to one while the aggregator reads the
    # other is a race that looks like missing results.
    type: Recreate
  selector:
    matchLabels:
      {{- include "test-env.componentSelectorLabels" (dict "context" . "component" .Values.minio.component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "test-env.componentLabels" (dict "context" . "component" .Values.minio.component) | nindent 8 }}
      annotations:
        # Rolls the pod when the credentials change, so it never keeps serving
        # with keys the clients have stopped using.
        checksum/s3-secret: {{ include (print $.Template.BasePath "/secret-s3.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "test-env.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "test-env.s3SecretName" . }}
                  key: access-key-id
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "test-env.s3SecretName" . }}
                  key: secret-access-key
            # Nothing browses this; turning the console off keeps the pod to one
            # listening port and one thing to reason about.
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.minio.storage.sizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-env.minioServiceName" . }}
  labels:
    {{- include "test-env.componentLabels" (dict "context" . "component" .Values.minio.component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "test-env.componentSelectorLabels" (dict "context" . "component" .Values.minio.component) | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
{{- end }}
