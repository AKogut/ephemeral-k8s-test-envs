{{- if and (eq .Values.database.backend "postgres") (not .Values.database.postgres.existingSecret) }}
{{/*
The database password.

Same resolution as the JWT key and the bucket credentials, and for the same
reason: the `lookup` keeps the value already in the cluster, so `helm upgrade`
does not hand the services a new password while Postgres is still expecting the
old one — the initdb only reads POSTGRES_PASSWORD once, on an empty volume, so
a regenerated password locks the environment out of its own database.

Alphanumeric on purpose. The connection URL is assembled in the pod as
`postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST)…`, and a `@`, a `/` or a `:`
in the password would end it somewhere other than where it means to — a
password that works everywhere except in the one place it is used.

`existingSecret` is the way to point an environment at a database whose
credentials come from somewhere else entirely.
*/}}
{{- $secretName := printf "%s-postgres" (include "test-env.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data "password") -}}
  {{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
  {{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "test-env.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
