{{/*
The application's service account.

It has no Role and no RoleBinding, and `automountServiceAccountToken: false`.
A reverse proxy and two CRUD services have no business holding a credential that
can talk to the Kubernetes API, so they are not given one.

Later phases add separate, narrowly-scoped accounts for the two workloads that
genuinely do need the API — the aggregator, which reads one Job's status, and the
teardown Job, which deletes one namespace.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "test-env.serviceAccountName" . }}
  labels:
    {{- include "test-env.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
