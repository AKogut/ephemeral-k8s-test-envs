version: 2

# Two majors are held back deliberately, in every npm package.
#
#   @types/node  — describes the standard library of a specific Node major. The
#                  runtime here is Node 22 (`engines`, and every Dockerfile base
#                  image), so types from a later major would advertise APIs that
#                  are not present at runtime. This tracks the runtime, and moves
#                  when the runtime moves — not before.
#
#   typescript   — 7.x type-checks this code since the tsconfigs moved to 6.0,
#                  but typescript-eslint, which the type-aware lint runs on,
#                  accepts TypeScript below 6.1 only. A major that the lint
#                  cannot load is a deliberate change with its own pull request,
#                  not a dependency bump.
#
# Both remain open to minor and patch updates, so security fixes still arrive.

updates:
  # Six independent npm packages — no workspace hoisting, so each is tracked
  # separately and an update to one cannot silently change another.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/auth-service
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/notes-service
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/gateway
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /scripts
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tests/api
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule: { interval: monthly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /app/auth-service
      - /app/notes-service
      - /app/gateway
      - /tests/api
      - /scripts
    schedule: { interval: monthly }
