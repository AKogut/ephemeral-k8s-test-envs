version: 2

# Two majors are held back deliberately, in every npm package.
#
#   @types/node  — describes the standard library of a specific Node major. The
#                  runtime here is Node 26 (`engines`, and every Dockerfile base
#                  image), so types from a later major would advertise APIs that
#                  are not present at runtime. This tracks the runtime, and moves
#                  when the runtime moves — not before.
#
#   typescript   — 7.x type-checks this code since the tsconfigs moved to 6.0,
#                  but typescript-eslint, which the type-aware lint runs on,
#                  accepts TypeScript below 6.1 only. A major that the lint
#                  cannot load is a deliberate change with its own pull request,
#                  not a dependency bump.
#
# Both remain open to minor and patch updates, so security fixes still arrive.

updates:
  # Six independent npm packages: no workspace hoisting, so each keeps its own
  # lockfile and an update to one cannot silently change another. Their minor
  # and patch updates arrive together, in one pull request.
  - package-ecosystem: npm
    directories:
      - /
      - /app/auth-service
      - /app/notes-service
      - /app/gateway
      - /scripts
      - /tests/api
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /app/auth-service
      - /app/notes-service
      - /app/gateway
      - /tests/api
      - /scripts
    schedule: { interval: weekly }
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
