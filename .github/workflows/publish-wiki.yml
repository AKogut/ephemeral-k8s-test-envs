name: Publish wiki

# The wiki is kept in-repo under docs/wiki/ so it is reviewed in pull requests
# like any other file, then mirrored to the GitHub wiki on merge. Editing the
# wiki directly in the browser is possible but the change would be overwritten by
# the next push to main.

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror docs/wiki to the GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone the wiki repository
        id: clone
        run: |
          # The wiki is a separate git repository. It only exists once the first
          # page has been created, so a failure here is expected on a fresh repo
          # and is reported rather than treated as a build failure.
          if git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The wiki repository does not exist yet. Create the first page in the GitHub UI (Wiki tab), then re-run this workflow."
          fi

      - name: Sync pages
        if: steps.clone.outputs.exists == 'true'
        run: |
          # Remove pages that no longer exist in docs/wiki, then copy everything
          # across, so the wiki is a mirror rather than an append-only pile.
          # _Sidebar.md and _Footer.md are tracked in docs/wiki too, so they
          # survive the delete — a sidebar that only exists in the wiki would be
          # silently removed by the first sync after it was hand-written.
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md wiki/

          # The two renderers disagree about how a page is addressed. In the
          # repository, docs/wiki/ is browsed as ordinary files, so a link has to
          # be `Runbook.md` to resolve. The wiki serves pages without the
          # extension, where `Runbook.md` is a 404.
          #
          # The files are written the repository's way — that is the copy people
          # review in a pull request — and the extension is stripped on the way
          # in. Only bare page names are touched: anything with a slash, a dot in
          # the middle or a scheme is left alone.
          sed -i -E 's@\]\(([A-Za-z0-9_-]+)\.md\)@](\1)@g' wiki/*.md

      - name: Every link points at a page that exists
        if: steps.clone.outputs.exists == 'true'
        run: |
          # A link to a page that was renamed or never written renders as plain
          # text in the wiki, silently. This is the check that would have caught
          # it.
          broken=0
          for page in docs/wiki/*.md; do
            while read -r target; do
              [ -z "$target" ] && continue
              if [ ! -f "docs/wiki/$target" ]; then
                echo "::error file=$page::links to $target, which does not exist"
                broken=1
              fi
            done <<< "$(grep -oE '\]\([A-Za-z0-9_-]+\.md\)' "$page" | sed -E 's@\]\((.*)\)@\1@')"
          done
          [ "$broken" = "0" ] && echo "every internal wiki link resolves"

      - name: Every page is reachable from the sidebar
        if: steps.clone.outputs.exists == 'true'
        run: |
          # A wiki page nobody links to is a page nobody reads.
          missing=0
          for page in docs/wiki/*.md; do
            name=$(basename "$page" .md)
            case "$name" in _*) continue ;; esac
            if ! grep -q "($name.md)" docs/wiki/_Sidebar.md; then
              echo "::error::$name is not linked from _Sidebar.md"
              missing=1
            fi
          done
          [ "$missing" = "0" ] && echo "all pages linked from the sidebar"

      - name: Commit and push
        if: steps.clone.outputs.exists == 'true'
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git add -A
          git commit -m "docs: sync wiki from ${{ github.sha }}"
          git push
          echo "Wiki updated from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
