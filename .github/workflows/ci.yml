name: Ephemeral environment

# The full lifecycle in one workflow:
#
#   verify (no cluster) -> build the images -> kind cluster -> helm install
#   -> sharded run -> aggregate -> publish -> teardown -> prove teardown happened
#
# Every environment is named after what created it (pr-<number> or run-<id>), and
# every step that could leave something behind is paired with an `if: always()`
# teardown plus an assertion that it worked.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shards:
        description: Number of parallel test shards
        type: number
        default: 4
      keep_environment:
        description: Skip teardown for debugging (the self-destruct Job still applies)
        type: boolean
        default: false
      simulate_fork:
        description: Take the fork path — build without pushing, carry the images as artifacts
        type: boolean
        default: false

concurrency:
  # A new push to the same PR replaces the previous run and, with it, the
  # previous environment. Without this, two runs would fight over one namespace.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  # A pull request from a fork gets a read-only GITHUB_TOKEN however generous
  # the `permissions:` block is — deliberate on GitHub's part, and it cannot be
  # overridden. So every step that writes outside the run is gated on this
  # instead of attempted and left to 403: the registry push, the layer cache,
  # the code-scanning upload and the summary comment.
  #
  # Nothing that *checks* anything is gated on it. A fork run builds the same
  # five images, scans them under the same rules, creates the same cluster and
  # runs the same suite. See docs/ci-pipeline.md#a-pull-request-from-a-fork.
  #
  # `simulate_fork` forces the false branch on a manual run. Without it the
  # path that only forks take would never execute in this repository, and an
  # untaken branch is how the NetworkPolicy managed to be wrong in three ways
  # across several releases (#90).
  CAN_WRITE: ${{ !inputs.simulate_fork && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
  # Pinned rather than :latest — a storage backend that changes under the tests
  # would turn a real regression and an upstream change into the same red build.
  MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  # Pinned for the same reason: a CNI that changes under the policy tests would
  # make an upstream change and a real regression look identical.
  CALICO_MANIFEST: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
  # Pinned for the same reason, and the kind-specific manifest because it is the
  # one that works without a cloud load balancer.
  INGRESS_NGINX_MANIFEST: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/kind/deploy.yaml

jobs:
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install the assertion script's dependency
        # Hoisted out of the step that used to do it inline: two steps now run
        # assert-security-defaults.py, and the first of them was the one
        # installing it.
        run: python3 -m pip install --quiet pyyaml

      - name: Lint with both value sets
        run: |
          helm lint charts/test-env
          helm lint charts/test-env -f charts/test-env/values-ci.yaml

      - name: Render
        run: |
          helm template ci charts/test-env --namespace ci \
            -f charts/test-env/values-ci.yaml --set image.tag=deadbeef > /tmp/rendered.yaml
          grep '^kind:' /tmp/rendered.yaml | sort | uniq -c

      - name: Renders at every supported shard count
        run: |
          for shards in 1 2 4 8 16; do
            echo "::group::shards=$shards"
            helm template ci charts/test-env --namespace ci --set tests.shards=$shards \
              | grep -E 'completionMode|completions:|parallelism:'
            echo "::endgroup::"
          done

      - name: The quota tracks the shard count
        run: |
          # A quota that does not move with tests.shards is worse than none: it
          # would reject the pods it was sized before anyone changed the value,
          # and report that as a Pending pod rather than as a stale number.
          previous=0
          for shards in 1 4 16; do
            # `requests.cpu:` is spelled that way only inside a ResourceQuota —
            # a pod spec nests plain `cpu:` under `resources:` — so the first
            # match is the quota's own figure.
            cpu=$(helm template ci charts/test-env --set "tests.shards=$shards" \
              | grep -m1 'requests\.cpu:' | tr -dc '0-9')
            echo "shards=$shards -> requests.cpu=${cpu}m"
            if [ "$cpu" -le "$previous" ]; then
              echo "::error::the quota did not grow between shard counts ($previous -> $cpu)"
              exit 1
            fi
            previous=$cpu
          done

          # An unreadable quantity must fail the render rather than count as zero,
          # which would produce a quota that looks like protection and is not.
          if helm template ci charts/test-env --set 'tests.resources.requests.cpu=1.5' >/dev/null 2>&1; then
            echo "::error::a CPU quantity the chart cannot parse was accepted"
            exit 1
          fi
          echo "confirmed: an unparseable quantity is rejected at render time"

      - name: No shared volume survives anywhere in the chart
        run: |
          # The property the whole design rests on, asserted rather than
          # assumed: nothing the chart renders can tie a shard pod to one node.
          if grep -qE 'kind: PersistentVolumeClaim|persistentVolumeClaim' /tmp/rendered.yaml; then
            echo "::error::the chart renders a PersistentVolumeClaim again"
            exit 1
          fi
          echo "confirmed: no PersistentVolumeClaim, no claim reference"

          # And the other half of the same property, checked by the script
          # below: nothing ties a shard to a node any more, but nothing spread
          # them either until the Job said so.
          python3 scripts/assert-shard-spread.py /tmp/rendered.yaml

      - name: Reject invalid values
        run: |
          # Testing that a chart renders is easy. Testing that it *refuses* to
          # render nonsense is what catches a guard that quietly stopped guarding.
          for bad in "tests.shards=0" "tests.shards=999" "notes.authMode=nope" "notes.authMode=" \
                     "minio.enabled=false" "tests.results.s3.bucket=" \
                     "tests.spread.whenUnsatisfiable=Sometimes" "tests.spread.maxSkew=0" \
                     "database.backend=mysql" "gateway.ingress.enabled=true"; do
            if helm template ci charts/test-env --set "$bad" >/dev/null 2>&1; then
              echo "::error::chart accepted invalid value: $bad"
              exit 1
            fi
            echo "correctly rejected: $bad"
          done

          # Two values at once, so it does not fit the loop above: asking for
          # Postgres without deploying one and without saying where it is.
          if helm template ci charts/test-env \
              --set 'database.backend=postgres' --set 'database.postgres.deploy=false' >/dev/null 2>&1; then
            echo "::error::chart accepted postgres with nothing to connect to"
            exit 1
          fi
          echo "correctly rejected: postgres with no server to point at"

      - name: Security defaults are actually applied
        run: python3 scripts/assert-security-defaults.py /tmp/rendered.yaml

  sharding:
    name: Shard planner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm --prefix scripts ci

      - name: Typecheck
        run: npm --prefix scripts run typecheck

      - name: Start MinIO for the live storage tests
        run: |
          # Started here rather than as a `services:` container because MinIO
          # needs a command argument (`server /data`) and service containers
          # cannot override one.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=testkey \
            -e MINIO_ROOT_PASSWORD=testsecret123 \
            "$MINIO_IMAGE" server /data

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is live"; exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become healthy"
          docker logs minio
          exit 1

      - name: Unit tests with coverage
        env:
          # The signature layer is checked against AWS's published vectors, but
          # only a real server catches what a stub cannot: a header it insists
          # on, a listing that pages differently, an encoding it rejects. The
          # suite refuses to skip these when CI is set, so a missing MinIO is a
          # red build rather than silence.
          RESULTS_S3_ENDPOINT: http://127.0.0.1:9000
          RESULTS_S3_BUCKET: results
          RESULTS_S3_ACCESS_KEY_ID: testkey
          RESULTS_S3_SECRET_ACCESS_KEY: testsecret123
        run: |
          # `tee` would swallow a failing exit status without this.
          set -o pipefail

          # The thresholds are gates, not decoration: they sit at what the suite
          # already achieves, so the only way past them is to add the test with
          # the code. Functions are pinned at 100 because a new exported
          # function nobody called is the failure worth catching.
          npm run test:coverage 2>&1 | tee /tmp/coverage.txt

      - name: Publish the coverage table
        if: always()
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' /tmp/coverage.txt \
              | sed 's/^# \{0,1\}//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show the plan the shard pods will compute
        run: |
          npm run shard:plan | tee /tmp/plan.txt

          # Warned on, not gated. The figure is self-referential — it says how
          # evenly the planner split the weights it was given, not how evenly
          # the real work landed — and it moves a point or two between runs. A
          # threshold this far below the usual 96-98% only fires when one file
          # has come to dominate, which is the case worth a human looking.
          balance=$(grep -oE 'balance: [0-9]+' /tmp/plan.txt | grep -oE '[0-9]+' || echo 100)
          if [ "$balance" -lt 90 ]; then
            echo "::warning::shard balance is ${balance}% — one spec file may now dominate the suite"
          fi

      - name: The plan covers every spec file exactly once
        run: |
          # The planner's own unit tests assert this on synthetic input. This
          # asserts it on the real suite, which is what actually ships.
          total=4
          expected=$(find tests/api/specs -name '*.spec.ts' | wc -l | tr -d ' ')
          assigned=0
          all=""
          for i in $(seq 0 $((total - 1))); do
            files=$(npm --prefix scripts run --silent shard -- \
              --dir ../tests/api/specs --weights ../tests/api/test-weights.json \
              --index "$i" --total "$total" --format files)
            count=$(printf '%s' "$files" | grep -c . || true)
            echo "shard $i: $count file(s)"
            assigned=$((assigned + count))
            all="$all$files"$'\n'
          done
          unique=$(printf '%s' "$all" | grep -c . || true)
          distinct=$(printf '%s' "$all" | grep . | sort -u | wc -l | tr -d ' ')
          echo "expected=$expected assigned=$assigned distinct=$distinct"
          if [ "$assigned" != "$expected" ] || [ "$distinct" != "$expected" ]; then
            echo "::error::shard plan does not cover every spec file exactly once"
            exit 1
          fi

  suite:
    name: API suite typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm --prefix tests/api ci
      - name: Typecheck
        run: npm --prefix tests/api run typecheck

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh

  code:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          # All five packages: `npm run typecheck` at the root spans every one of
          # them, so installing only the services would fail on missing @types.
          npm run ci:install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          # The rules are type-aware, so every package has to be installed:
          # without its node_modules a package's imports resolve to `any` and
          # the interesting rules silently pass.
          npm ci
          npm run ci:install

      - name: ESLint
        run: npm run lint

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to publish the vulnerability scan
    strategy:
      fail-fast: false
      matrix:
        component: [auth-service, notes-service, gateway]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.component }}
          file: app/${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect ${{ matrix.component }}:ci --format '{{.Size}}')
          printf '| `%s` | %s MB |\n' "${{ matrix.component }}" "$((size / 1000000))" >> "$GITHUB_STEP_SUMMARY"

      # Two passes over the image that was just built, and the difference between
      # them is the whole policy.
      #
      # The first records every fixable HIGH and CRITICAL into code scanning. It
      # never fails the build — it is the trend line, visible whether or not
      # anything is blocking today.
      #
      # The second is the gate, and it is deliberately narrower: fixable
      # CRITICAL only. Gating on HIGH means the pipeline goes red on a Tuesday
      # because an advisory landed in a base image nobody touched, and a check
      # that breaks on its own teaches people to merge past it. `ignore-unfixed`
      # is the same argument from the other side: a vulnerability with no
      # available fix is information, not a decision anyone can act on here.
      - name: Record what is fixable in this image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.component }}:ci
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Code scanning is a write, so a fork cannot reach it. The gate below
      # is not, and still runs — a fork's images are held to the same rule.
      - name: Publish it to code scanning
        if: env.CAN_WRITE == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Fail on a fixable critical vulnerability
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.component }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Container starts, serves and shuts down cleanly
        run: |
          # A container that builds is not the same as a container that runs.
          # This catches a runtime stage missing a file the build stage had.
          docker run -d --name probe -p 127.0.0.1:8080:${{ matrix.component == 'gateway' && '3000' || (matrix.component == 'auth-service' && '3001' || '3002') }} \
            -e JWT_SECRET=ci-secret -e DATABASE_PATH=:memory: \
            ${{ matrix.component }}:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done

          if [ "${ready:-0}" != "1" ]; then
            echo "::error::${{ matrix.component }} never became healthy"
            docker logs probe
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/healthz
          echo
          curl -fsS http://127.0.0.1:8080/version
          echo

          # SIGTERM must drain rather than be ignored — Kubernetes relies on it.
          docker stop --timeout 15 probe
          exit_code=$(docker inspect probe --format '{{.State.ExitCode}}')
          docker logs probe | tail -5
          if [ "$exit_code" != "0" ]; then
            echo "::error::${{ matrix.component }} did not shut down cleanly (exit $exit_code)"
            exit 1
          fi

  runner:
    name: Build the test runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to publish the vulnerability scan
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          # Build context is the repository root: the runner needs both the
          # suite (tests/api) and the shard planner (scripts).
          context: .
          file: tests/api/Dockerfile
          push: false
          load: true
          tags: api-tests:ci
          cache-from: type=gha,scope=api-tests
          cache-to: type=gha,scope=api-tests,mode=max

      - name: Report image size
        run: |
          # Note: `docker image inspect .Size` reports the uncompressed size on a
          # standard Docker engine, but the content size when the containerd
          # image store is enabled (as on recent Docker Desktop). Both are
          # printed so the number in the docs is never ambiguous about which it
          # is, and the guard below is set well above either reading.
          size=$(docker image inspect api-tests:ci --format '{{.Size}}')
          docker images api-tests --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          printf '| `api-tests` | %s MB |\n' "$((size / 1000000))" >> "$GITHUB_STEP_SUMMARY"

          # A browser-bearing Playwright base adds well over a gigabyte. This
          # guard is what stops that creeping back in unnoticed — see ADR 0002.
          if [ "$size" -gt 700000000 ]; then
            echo "::error::api-tests image is $((size / 1000000)) MB — browsers may have crept back in"
            exit 1
          fi

      # Same policy as the service images: record everything fixable, gate only
      # on fixable CRITICAL.
      - name: Record what is fixable in this image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-tests:ci
          format: sarif
          output: trivy-api-tests.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Code scanning is a write, so a fork cannot reach it. The gate below
      # is not, and still runs — a fork's images are held to the same rule.
      - name: Publish it to code scanning
        if: env.CAN_WRITE == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-tests.sarif
          category: trivy-api-tests

      - name: Fail on a fixable critical vulnerability
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-tests:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: The shard planner works inside the image
        run: |
          # The planner is compiled into the image as a plain JS CLI, so this
          # also proves the runtime needs neither TypeScript nor tsx.
          for i in 0 1 2 3; do
            files=$(docker run --rm --entrypoint node api-tests:ci \
              /opt/sharder/shard-tests.js --dir specs --total 4 --index "$i" --format files)
            count=$(printf '%s' "$files" | grep -c . || true)
            echo "shard $i -> $count file(s)"
            [ "$count" -gt 0 ] || { echo "::error::shard $i got no files"; exit 1; }
          done

      - name: No browsers are installed
        run: |
          if docker run --rm --entrypoint sh api-tests:ci -c 'ls ~/.cache/ms-playwright 2>/dev/null | grep .'; then
            echo "::error::browser binaries found in the runner image"
            exit 1
          fi
          echo "confirmed: no browser binaries in the image"

  aggregator:
    name: Build the aggregator image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to publish the vulnerability scan
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: scripts
          file: scripts/Dockerfile
          push: false
          load: true
          tags: aggregator:ci
          cache-from: type=gha,scope=aggregator
          cache-to: type=gha,scope=aggregator,mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect aggregator:ci --format '{{.Size}}')
          printf '| `aggregator` | %s MB |\n' "$((size / 1000000))" >> "$GITHUB_STEP_SUMMARY"

      # Same policy as the service images: record everything fixable, gate only
      # on fixable CRITICAL. This one carries no production dependencies at all,
      # so anything found here comes from the base image.
      - name: Record what is fixable in this image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aggregator:ci
          format: sarif
          output: trivy-aggregator.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Code scanning is a write, so a fork cannot reach it. The gate below
      # is not, and still runs — a fork's images are held to the same rule.
      - name: Publish it to code scanning
        if: env.CAN_WRITE == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-aggregator.sarif
          category: trivy-aggregator

      - name: Fail on a fixable critical vulnerability
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aggregator:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: It has no production dependencies
        run: |
          # The merge is plain Node. If a dependency ever appears here, the
          # "no production dependencies" claim in the docs has gone stale.
          if docker run --rm --entrypoint sh aggregator:ci -c 'ls node_modules 2>/dev/null | grep .'; then
            echo "::error::aggregator image has production dependencies"
            exit 1
          fi
          echo "confirmed: no production dependencies"

      - name: All three entrypoints respond
        run: |
          for entry in aggregate-results wait-for-jobs self-destruct; do
            docker run --rm --entrypoint node aggregator:ci "dist/$entry.js" --help | head -3
          done

      - name: It merges a synthetic sharded run correctly
        run: |
          # An end-to-end check of the merge logic against files on disk,
          # including the retry collapsing the unit tests cover in isolation.
          mkdir -p /tmp/results/shard-0/allure-results /tmp/results/shard-1/allure-results
          cat > /tmp/results/shard-0/allure-results/a-result.json <<'JSON'
          {"uuid":"a","historyId":"h1","name":"passes","fullName":"suite > passes","status":"passed","start":0,"stop":1000}
          JSON
          cat > /tmp/results/shard-1/allure-results/b-result.json <<'JSON'
          {"uuid":"b","historyId":"h2","name":"flaky","fullName":"suite > flaky","status":"failed","start":0,"stop":500}
          JSON
          cat > /tmp/results/shard-1/allure-results/c-result.json <<'JSON'
          {"uuid":"c","historyId":"h2","name":"flaky","fullName":"suite > flaky","status":"passed","start":500,"stop":1000}
          JSON

          # The image runs as uid 1000 and the runner writes as 1001, so the
          # bind mount needs handing over. In a cluster this is the PVC's
          # fsGroup instead.
          sudo chown -R 1000:1000 /tmp/results

          docker run --rm -v /tmp/results:/results aggregator:ci \
            --input /results --env-id ci-synthetic --expect-shards 2

          sudo chmod -R a+r /tmp/results/merged
          python3 - <<'PY_INNER'
          import json
          s = json.load(open('/tmp/results/merged/summary.json'))
          assert s['totals']['tests'] == 2, f"expected 2 tests, got {s['totals']}"
          assert s['totals']['passed'] == 2, s['totals']
          assert s['totals']['flaky'] == 1, f"retry should be reported as flaky: {s['totals']}"
          assert s['totals']['retries'] == 1, s['totals']
          assert s['passed'] is True
          print('merge, retry collapsing and flaky detection all correct')
          PY_INNER

      - name: The self-destruct entrypoint refuses to run outside a pod
        run: |
          # It reads the service account token from the filesystem. Outside a
          # pod there is none, and it must say so rather than doing something
          # surprising.
          if docker run --rm --entrypoint node aggregator:ci dist/self-destruct.js 2>&1 \
               | grep -q 'only runs inside a pod'; then
            echo "correctly refused to run outside a cluster"
          else
            echo "::error::self-destruct did not fail cleanly outside a pod"
            exit 1
          fi

      - name: A missing shard directory fails aggregation
        run: |
          # Reporting a green run over a partial suite would be worse than failing.
          sudo rm -rf /tmp/results/merged
          if docker run --rm -v /tmp/results:/results aggregator:ci \
               --input /results --env-id ci --expect-shards 4; then
            echo "::error::aggregator accepted a run with missing shards"
            exit 1
          fi
          echo "correctly refused to aggregate an incomplete run"

  stack:
    name: docker compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: The three services agree they are one environment
        run: |
          set -euo pipefail
          curl -fsS localhost:3000/readyz | tee /tmp/ready.json
          echo

          # A full journey through the gateway: register, log in, create, read.
          curl -fsS -X POST localhost:3000/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.test","password":"correct-horse-battery-staple"}' >/dev/null

          token=$(curl -fsS -X POST localhost:3000/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.test","password":"correct-horse-battery-staple"}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")

          note=$(curl -fsS -X POST localhost:3000/notes \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"title":"from ci","tags":["ci"]}')
          echo "$note"

          # notes-service must have verified the token against auth-service.
          curl -fsS localhost:3002/readyz | grep -q 'verify-with-auth-service'
          echo "service-to-service verification is active"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=60

      - name: Tear down
        if: always()
        run: docker compose down -v

  postgres:
    name: docker compose stack on Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack with the database a network away
        run: |
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            up --build -d --wait --wait-timeout 300

      - name: The migrations ran, and ran before the services
        run: |
          set -euo pipefail
          # Each service migrates its own database. If either had been left to
          # create its schema on boot, this is where that would show up as
          # nothing to see.
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            logs auth-migrate notes-migrate | grep -c 'migration applied'

          for db in auth notes; do
            echo "::group::$db"
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
              exec -T postgres psql -U app -d "$db" -c '\dt'
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
              exec -T postgres psql -U app -d "$db" -tAc 'SELECT id, name FROM schema_migrations ORDER BY id'
            echo "::endgroup::"
          done

      - name: Running them again applies nothing
        run: |
          set -euo pipefail
          # The property that makes a migration Job safe to retry, and the one
          # the advisory lock exists for. A second run must find its work done
          # rather than repeat it or fail.
          out=$(docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            run --rm auth-migrate 2>&1)
          echo "$out"
          echo "$out" | grep -q '"applied":0' \
            || { echo "::error::a second migration run was not a no-op"; exit 1; }

      - name: The whole suite passes against Postgres
        run: |
          # Created here rather than left to Docker, which would make it root
          # while the container runs as uid 1000. Invisible on macOS, fatal on
          # Linux — this is the first job to run the suite as a container.
          mkdir -p results && chmod a+rwX results

          docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            --profile test run --rm api-tests

      - name: Two replicas share one database
        run: |
          set -euo pipefail
          # The point of the whole exercise, and something SQLite in the pod
          # cannot do: register against whichever replica answers, then log in
          # repeatedly and require every attempt to succeed. With per-pod
          # storage roughly half of these would fail.
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            -f .github/compose/scale-auth.yml up -d --wait --wait-timeout 240 --scale auth-service=2

          replicas=$(docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            -f .github/compose/scale-auth.yml ps auth-service --format '{{.Name}}' | grep -c .)
          [ "$replicas" = "2" ] || { echo "::error::expected 2 auth replicas, found $replicas"; exit 1; }

          ok=0
          for i in 1 2 3 4 5; do
            email="replica-probe-$i@example.test"
            curl -fsS -X POST localhost:3000/auth/register -H 'content-type: application/json' \
              -d "{\"email\":\"$email\",\"password\":\"correct-horse-battery-staple\"}" >/dev/null
            for _ in 1 2 3 4; do
              if curl -fsS -X POST localhost:3000/auth/login -H 'content-type: application/json' \
                -d "{\"email\":\"$email\",\"password\":\"correct-horse-battery-staple\"}" >/dev/null; then
                ok=$((ok + 1))
              fi
            done
          done

          echo "$ok of 20 logins succeeded across 2 replicas"
          [ "$ok" = "20" ] || { echo "::error::the replicas are not sharing state"; exit 1; }

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs --tail=80

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml down -v

  # ------------------------------------------------------------------ build --
  # The five images the cluster jobs install, built once and delivered to them
  # by whichever route this run is allowed to use.
  #
  # A fork cannot push to the registry, and skipping the job on a fork would be
  # worse than the failure it avoids: the cluster job lists this one in
  # `needs:`, a skipped dependency skips it too, and a skipped required check
  # counts as a passing one. The pull request that deserves the most scrutiny
  # would be the one that got none. So the registry is treated as a delivery
  # mechanism rather than a requirement — a fork exports the same image as a
  # tarball and carries it between jobs as an artifact instead.
  build:
    name: Package ${{ matrix.component }}
    runs-on: ubuntu-latest
    # Only after everything that can be checked without a cluster has passed.
    needs: [chart, sharding, suite, scripts, code, images, runner, aggregator, stack, postgres]
    permissions:
      contents: read
      # Silently downgraded to read on a fork pull request. Asked for anyway:
      # it is what this job needs where it can have it, and CAN_WRITE decides
      # whether it is used.
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: auth-service
            context: app/auth-service
            dockerfile: app/auth-service/Dockerfile
          - component: notes-service
            context: app/notes-service
            dockerfile: app/notes-service/Dockerfile
          - component: gateway
            context: app/gateway
            dockerfile: app/gateway/Dockerfile
          - component: api-tests
            context: .
            dockerfile: tests/api/Dockerfile
          - component: aggregator
            context: scripts
            dockerfile: scripts/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag and namespace
        id: meta
        run: |
          # The commit SHA, never a branch name: an environment must be pinned to
          # exactly the code that produced it, or the report describes something
          # other than the pull request.
          echo "tag=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

          # A container repository name must be lowercase, and github.repository
          # preserves the owner's capitalisation. Actions expressions have no
          # lowercase function, so it is done here.
          echo "namespace=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.CAN_WRITE == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, two destinations. The image is identical either way — same
      # context, same build-args, same tag — and only where it is put differs,
      # which is why this is one step with three computed inputs rather than
      # two steps that must be kept in step with each other.
      #
      # `cache-to` goes with it: the Actions cache is a write too, and a fork
      # writing to the base repository's cache is refused. `cache-from` still
      # reads, so a fork build is no slower than a first build of the same
      # code here.
      - name: Build, and push it or keep it
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.CAN_WRITE == 'true' }}
          outputs: ${{ env.CAN_WRITE == 'true' && '' || format('type=docker,dest=/tmp/{0}.tar', matrix.component) }}
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          build-args: |
            SERVICE_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ steps.meta.outputs.tag }}
          # Scoped per component, so changing one service does not invalidate the
          # cache for the other four.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=gha,scope={0},mode=max', matrix.component) || '' }}
          provenance: false

      - name: Hand the image to the cluster jobs
        if: env.CAN_WRITE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.component }}
          path: /tmp/${{ matrix.component }}.tar
          # The only consumers are the five cluster jobs in this same run.
          # Keeping five image tarballs for a fortnight after that would be
          # storage spent on nothing.
          retention-days: 1
          # A missing tarball here becomes ErrImageNeverPull twenty minutes
          # later in a job that reads as if the cluster were at fault.
          if-no-files-found: error

  # ------------------------------------------------- the ephemeral environment --
  networkpolicy:
    name: NetworkPolicy is enforced
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      IMAGE_NAMESPACE: ${{ needs.build.outputs.namespace }}
      NS: netpol
    steps:
      - uses: actions/checkout@v7

      - name: Create a cluster whose CNI enforces policy
        run: |
          # kind's default CNI implements pod networking and ignores
          # NetworkPolicy entirely, which is why the chart's policy went several
          # releases while being wrong in three separate ways. Calico replaces it.
          kind create cluster --name netpol --config scripts/kind-networkpolicy.yaml --wait 120s
          kubectl apply -f "$CALICO_MANIFEST"
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Side-load the images
        uses: ./.github/actions/load-images
        with:
          cluster: netpol
          registry: ${{ env.REGISTRY }}
          namespace: ${{ needs.build.outputs.namespace }}
          tag: ${{ needs.build.outputs.tag }}
          from-registry: ${{ env.CAN_WRITE }}

      - name: Install with the policy enforced
        run: |
          helm install netpol ./charts/test-env --namespace "$NS" --create-namespace \
            --set "image.tag=${IMAGE_TAG}" \
            --set "image.namespace=${IMAGE_NAMESPACE}" \
            --set "tests.shards=2" \
            --set "networkPolicy.enabled=true" \
            --wait --timeout 6m

      - name: The suite passes with every packet policed
        run: |
          # The positive half. A default-deny policy that lets nothing through
          # would also pass a negative test, so this has to hold first.
          if ! kubectl -n "$NS" wait --for=condition=complete --timeout=10m job/netpol-test-env-shards-r1; then
            echo "::error::the suite could not run under the enforced policy"
            kubectl -n "$NS" logs -l app.kubernetes.io/component=api-tests --tail=40
            kubectl -n "$NS" get networkpolicy
            exit 1
          fi
          kubectl -n "$NS" logs job/netpol-test-env-aggregate-r1 --tail=30 | grep -E 'Total|passed' || true

      - name: A pod outside the environment is refused
        run: |
          # The negative half, and the one that makes the policy a claim rather
          # than a document. An unlabelled pod in the same namespace must not
          # reach the services.
          kubectl -n "$NS" run intruder --image=busybox:1.36 --restart=Never --command -- sleep 300
          kubectl -n "$NS" wait --for=condition=ready pod/intruder --timeout=120s

          blocked=0
          for target in netpol-test-env-auth:3001 netpol-test-env-notes:3002 netpol-test-env-minio:9000; do
            if kubectl -n "$NS" exec intruder -- timeout 6 wget -q -O- -T 5 "http://$target/healthz" >/dev/null 2>&1; then
              echo "::error::$target was reachable from an unlabelled pod"
            else
              echo "blocked: $target"
              blocked=$((blocked + 1))
            fi
          done
          [ "$blocked" = "3" ] || exit 1

      - name: …and reachable once the policy is removed
        run: |
          # The control. Without it, "blocked" could mean a wrong port or a
          # service that never resolved, and the negative test above would pass
          # for entirely the wrong reason.
          helm upgrade netpol ./charts/test-env --namespace "$NS" --reuse-values \
            --set "networkPolicy.enabled=false" --wait --timeout 3m
          sleep 5

          reachable=0
          for target in netpol-test-env-auth:3001 netpol-test-env-notes:3002; do
            if kubectl -n "$NS" exec intruder -- timeout 6 wget -q -O- -T 5 "http://$target/healthz" >/dev/null 2>&1; then
              echo "reachable without the policy: $target"
              reachable=$((reachable + 1))
            else
              echo "::error::$target unreachable even with no policy — the negative test proves nothing"
            fi
          done
          [ "$reachable" = "2" ] || exit 1

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name netpol

  preview-url:
    name: The preview URL reaches the gateway
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      NS: preview
      DOMAIN: preview.test
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: preview
          # ingress-nginx's kind manifest wants a node labelled
          # ingress-ready=true, which kind does not set on its own.
          config: scripts/kind-ingress.yaml
          wait: 120s

      - name: Put the images into the cluster
        uses: ./.github/actions/load-images
        with:
          cluster: preview
          registry: ${{ env.REGISTRY }}
          namespace: ${{ needs.build.outputs.namespace }}
          tag: ${{ needs.build.outputs.tag }}
          from-registry: ${{ env.CAN_WRITE }}

      - name: Install an ingress controller
        run: |
          # Pinned like every other upstream image here: a controller that
          # changes under the test would make an upstream release and a real
          # regression look identical.
          set -euo pipefail
          kubectl apply -f "$INGRESS_NGINX_MANIFEST"

          # `wait --for=condition=available` straight after `apply` can match a
          # status that has not caught up with the new spec. `rollout status`
          # cannot.
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=5m

          # Then wait for the thing that actually refused the connection.
          # ingress-nginx registers a validating webhook, so *creating* an
          # Ingress calls back into the controller — and a rolled-out
          # Deployment is not the same as an admission endpoint with
          # addresses. Helm fails the entire install on the difference:
          #
          #   failed calling webhook "validate.nginx.ingress.kubernetes.io":
          #   dial tcp …:443: connect: connection refused
          addresses=""
          for _ in $(seq 1 60); do
            addresses=$(kubectl -n ingress-nginx get endpoints ingress-nginx-controller-admission \
              -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            [ -n "$addresses" ] && break
            sleep 2
          done
          [ -n "$addresses" ] || { echo "::error::the admission webhook never got an endpoint"; exit 1; }
          echo "admission webhook is answering at: $addresses"

      - name: Install the environment with a hostname
        run: |
          helm install preview ./charts/test-env --namespace "$NS" --create-namespace \
            --set "image.registry=${REGISTRY}" \
            --set "image.namespace=${{ needs.build.outputs.namespace }}" \
            --set "image.tag=${{ needs.build.outputs.tag }}" \
            --set "image.pullPolicy=Never" \
            --set "tests.enabled=false" \
            --set "aggregator.enabled=false" \
            --set "minio.enabled=false" \
            --set "gateway.ingress.enabled=true" \
            --set "gateway.ingress.domain=${DOMAIN}" \
            --wait --timeout 6m

      - name: The host is the namespace, so the URL names the environment
        run: |
          set -euo pipefail
          host=$(kubectl -n "$NS" get ingress preview-test-env-gateway \
            -o jsonpath='{.spec.rules[0].host}')
          echo "host: $host"
          [ "$host" = "${NS}.${DOMAIN}" ] || {
            echo "::error::expected ${NS}.${DOMAIN}, got $host"; exit 1; }

          kubectl -n "$NS" get ingress -o wide

      - name: A request to that hostname reaches the gateway
        run: |
          set -euo pipefail
          # Asked from inside the cluster, with the Host header the way DNS
          # would supply it. That is what the controller routes on, so this
          # tests the rule rather than a port-forward dressed up as a URL.
          # Outside the environment's namespace, and not to dodge anything:
          # somebody opening a preview URL is not inside it either. The first
          # attempt put the probe in the namespace and the ResourceQuota
          # refused it — correctly, since the quota is computed from the
          # release's own workloads and a curl pod is not one of them (#83).
          kubectl -n default run urlprobe --image=curlimages/curl:8.11.1 --restart=Never \
            --command -- sleep 300
          kubectl -n default wait --for=condition=ready pod/urlprobe --timeout=120s

          controller=http://ingress-nginx-controller.ingress-nginx.svc.cluster.local

          # Retried, because creating an Ingress and having it routed are two
          # different moments: the controller answers 503 for the rule it has
          # not synced yet. Observed locally — first request 503, the same one
          # 200 a few seconds later — so a single immediate curl would be a
          # flake shipped as a check.
          body=""
          for _ in $(seq 1 20); do
            body=$(kubectl -n default exec urlprobe -- \
              curl -fsS --max-time 15 -H "Host: ${NS}.${DOMAIN}" "$controller/readyz" 2>/dev/null || true)
            [ -n "$body" ] && break
            sleep 3
          done
          [ -n "$body" ] || { echo "::error::the preview URL never answered"; exit 1; }
          echo "$body"

          # /readyz is the gateway's own, and it names the service that answered.
          echo "$body" | grep -q '"service":"gateway"' || {
            echo "::error::something other than the gateway answered the preview URL"; exit 1; }

          # The control: the same request without the hostname must NOT be
          # served this environment. Otherwise "it answered" would only mean
          # the controller answers everything.
          code=$(kubectl -n default exec urlprobe -- \
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H "Host: someone-else.${DOMAIN}" \
            "$controller/readyz")
          echo "an unknown hostname gets: $code"
          [ "$code" = "404" ] || {
            echo "::error::the controller served this environment to a hostname that is not its own ($code)"; exit 1; }

      - name: The URL dies with the environment
        run: |
          set -euo pipefail
          # An Ingress is namespaced, so this is the property that keeps a
          # preview URL from outliving what it points at — the same class of
          # leak as an orphaned PersistentVolume.
          kubectl -n default delete pod urlprobe --ignore-not-found >/dev/null
          helm uninstall preview -n "$NS" --wait --timeout 3m
          kubectl delete namespace "$NS" --wait=true --timeout=3m
          ./scripts/verify-teardown.sh --namespace "$NS" --release preview

          left=$(kubectl get ingress -A --no-headers 2>/dev/null | grep -c "$NS" || true)
          [ "$left" = "0" ] || { echo "::error::an Ingress outlived its environment"; exit 1; }
          echo "confirmed: no Ingress remains"

      - name: Show what failed
        if: failure()
        run: |
          kubectl -n "$NS" get all,ingress -o wide || true
          kubectl -n ingress-nginx logs deployment/ingress-nginx-controller --tail=40 || true

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name preview || true

  self-destruct:
    name: The self-destruct layer fires, and leaves nothing
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: selfdestruct
          wait: 120s

      - name: Put the images into the cluster
        uses: ./.github/actions/load-images
        with:
          cluster: selfdestruct
          registry: ${{ env.REGISTRY }}
          namespace: ${{ needs.build.outputs.namespace }}
          tag: ${{ needs.build.outputs.tag }}
          from-registry: ${{ env.CAN_WRITE }}

      - name: Install one environment that will destroy itself, and one that will not
        run: |
          set -euo pipefail
          # The third teardown layer exists for the case where CI never comes
          # back: a cancelled workflow, a dead runner. In every ordinary run
          # the pipeline's own `helm uninstall` beats it to the namespace, so
          # its success has never been observed — invisible by construction,
          # which is exactly how the NetworkPolicy stayed wrong for releases.
          #
          # No --wait: readiness is not what is under test here, and the clock
          # on the Job starts as soon as its pod does.
          common=(--set "image.registry=${REGISTRY}"
                  --set "image.namespace=${{ needs.build.outputs.namespace }}"
                  --set "image.tag=${{ needs.build.outputs.tag }}"
                  --set "image.pullPolicy=Never"
                  --set "tests.enabled=false"
                  --set "aggregator.enabled=false"
                  --set "minio.enabled=false")

          helm install doomed ./charts/test-env --namespace doomed --create-namespace \
            "${common[@]}" \
            --set "teardown.selfDestruct.enabled=true" \
            --set "teardown.selfDestruct.afterSeconds=120"

          # The control. Without it, "the namespace disappeared" could mean the
          # cluster ate it, and the test would pass for the wrong reason.
          helm install survivor ./charts/test-env --namespace survivor --create-namespace \
            "${common[@]}" \
            --set "teardown.selfDestruct.enabled=false"

      - name: The namespace owns the cluster-scoped objects it would leave behind
        run: |
          set -euo pipefail
          # The mechanism, checked before the outcome. Deleting a namespace does
          # not delete ClusterRoles or ClusterRoleBindings, so the Job hands
          # them to the namespace as an owner before it sleeps — which is also
          # why this is asserted while the namespace still exists.
          uid=$(kubectl get namespace doomed -o jsonpath='{.metadata.uid}')
          for i in $(seq 1 30); do
            owner=$(kubectl get clusterrole doomed-test-env-teardown-doomed \
              -o jsonpath='{.metadata.ownerReferences[0].uid}' 2>/dev/null || true)
            [ -n "$owner" ] && break
            sleep 4
          done

          kubectl get clusterrole,clusterrolebinding doomed-test-env-teardown-doomed \
            -o jsonpath='{range .items[*]}{.kind}{" owner="}{.metadata.ownerReferences[0].kind}{"/"}{.metadata.ownerReferences[0].uid}{"\n"}{end}'

          if [ "$owner" != "$uid" ]; then
            echo "::error::the ClusterRole is not owned by the namespace (owner=$owner, namespace=$uid)"
            kubectl -n doomed logs -l app.kubernetes.io/component=teardown --tail=30 || true
            exit 1
          fi
          echo "confirmed: the namespace ($uid) owns its teardown RBAC"

      - name: Nobody deletes it, and it goes anyway
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if ! kubectl get namespace doomed >/dev/null 2>&1; then
              echo "the namespace deleted itself after ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the namespace was still there after 400s"
          kubectl -n doomed get jobs,pods
          kubectl -n doomed logs -l app.kubernetes.io/component=teardown --tail=40 || true
          exit 1

      - name: And it left nothing cluster-scoped behind
        run: |
          # The bug this job was written to catch. The self-destruct path used
          # to delete only the namespace, leaving a ClusterRole and a
          # ClusterRoleBinding granting delete on a namespace that no longer
          # existed — verified in kind before the fix, and this is what keeps
          # it fixed.
          ./scripts/verify-teardown.sh --namespace doomed --release doomed

      - name: The control is still standing
        run: |
          set -euo pipefail
          if ! kubectl get namespace survivor >/dev/null 2>&1; then
            echo "::error::the environment without a self-destruct Job disappeared too — the test above proves nothing"
            exit 1
          fi
          echo "confirmed: without the Job, the namespace stays"

      - name: Tear down the control
        if: always()
        run: |
          helm uninstall survivor -n survivor --wait --timeout 3m || true
          kubectl delete namespace survivor --wait=true --timeout=3m || true

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name selfdestruct || true

  postgres-environment:
    name: An environment on Postgres
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      NS: pgenv
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pgenv
          wait: 120s

      - name: Put the images into the cluster
        uses: ./.github/actions/load-images
        with:
          cluster: pgenv
          registry: ${{ env.REGISTRY }}
          namespace: ${{ needs.build.outputs.namespace }}
          tag: ${{ needs.build.outputs.tag }}
          from-registry: ${{ env.CAN_WRITE }}

      - name: Side-load Postgres too
        run: |
          set -euo pipefail
          # The chart's own images are loaded above and installed with
          # pullPolicy Never. Postgres is upstream and has its own policy, so
          # the node would pull it — from Docker Hub, whose anonymous rate
          # limit is shared across the runner fleet and fails at the worst
          # possible moment. Pulling once here makes the job deterministic.
          #
          # The tag comes from the chart rather than being repeated, so the two
          # cannot drift.
          ref=$(helm template pgenv ./charts/test-env --set database.backend=postgres \
            | grep -m1 -oE 'image: "postgres:[^"]+"' | cut -d'"' -f2)
          [ -n "$ref" ] || { echo "::error::could not read the Postgres image from the chart"; exit 1; }
          echo "loading $ref"
          docker pull -q "$ref"
          kind load docker-image --name pgenv "$ref"

      - name: Install with the database a network away, and two replicas each
        run: |
          # replicaCount 2 is the assertion, not a detail. With SQLite in the
          # pod it cannot be set at all — two replicas would each hold their
          # own database — so an environment that stands up this way is the
          # thing #89 asked for.
          helm install pgenv ./charts/test-env --namespace "$NS" --create-namespace \
            --values charts/test-env/values-ci.yaml \
            --set "image.registry=${REGISTRY}" \
            --set "image.namespace=${{ needs.build.outputs.namespace }}" \
            --set "image.tag=${{ needs.build.outputs.tag }}" \
            --set "image.pullPolicy=Never" \
            --set "database.backend=postgres" \
            --set "auth.replicaCount=2" \
            --set "notes.replicaCount=2" \
            --set "tests.shards=2" \
            --wait --timeout 8m

      - name: The migrations ran, once, before anything served
        run: |
          set -euo pipefail
          for db in auth notes; do
            kubectl -n "$NS" wait --for=condition=complete --timeout=5m "job/pgenv-test-env-migrate-$db"
            kubectl -n "$NS" logs "job/pgenv-test-env-migrate-$db" --tail=5
          done

          # One row per migration, in each service's own database. Two services
          # sharing one ledger is what the first attempt at this did, and it
          # collided on the primary key.
          for db in auth notes; do
            rows=$(kubectl -n "$NS" exec statefulset/pgenv-test-env-postgres -- \
              psql -U app -d "$db" -tAc 'SELECT count(*) FROM schema_migrations')
            echo "$db: $rows migration(s) recorded"
            [ "$rows" = "1" ] || { echo "::error::$db has $rows migrations recorded, expected 1"; exit 1; }
          done

      - name: Both data services really are running two replicas
        run: |
          set -euo pipefail
          kubectl -n "$NS" get pods -o wide
          for component in auth notes; do
            ready=$(kubectl -n "$NS" get deployment "pgenv-test-env-$component" -o jsonpath='{.status.readyReplicas}')
            echo "$component: $ready ready"
            [ "$ready" = "2" ] || { echo "::error::$component has $ready ready replicas, expected 2"; exit 1; }
          done

      - name: An account registered on one replica exists on the other
        run: |
          set -euo pipefail
          # The property the pod-local database forbids, asserted end to end
          # through the gateway: whichever replica answers the registration,
          # every later login has to succeed.
          # Labelled as the suite, not left bare. kind's default CNI ignores
          # NetworkPolicy, so an unlabelled pod would work here and break the
          # day this runs on a CNI that enforces — which is exactly how the
          # policy stayed wrong for several releases (#90).
          kubectl -n "$NS" run apiprobe --image=curlimages/curl:8.11.1 --restart=Never \
            --labels="app.kubernetes.io/name=test-env,app.kubernetes.io/instance=pgenv,app.kubernetes.io/component=api-tests" \
            --command -- sleep 300
          kubectl -n "$NS" wait --for=condition=ready pod/apiprobe --timeout=120s

          # Read from the Service rather than assumed. The gateway listens on
          # 3000 in the container and the Service publishes 80, and taking the
          # container's port here cost a run: every request sat until curl's
          # own timeout, 134 seconds each.
          port=$(kubectl -n "$NS" get svc pgenv-test-env-gateway -o jsonpath='{.spec.ports[0].port}')
          gw="http://pgenv-test-env-gateway:$port"
          echo "probing $gw"

          ok=0
          for i in 1 2 3 4 5; do
            email="replica-probe-$i@example.test"
            body="{\"email\":\"$email\",\"password\":\"correct-horse-battery-staple\"}"
            kubectl -n "$NS" exec apiprobe -- curl -fsS --max-time 10 -X POST "$gw/auth/register" \
              -H 'content-type: application/json' -d "$body" >/dev/null
            for _ in 1 2 3 4; do
              if kubectl -n "$NS" exec apiprobe -- curl -fsS --max-time 10 -X POST "$gw/auth/login" \
                -H 'content-type: application/json' -d "$body" >/dev/null; then
                ok=$((ok + 1))
              fi
            done
          done

          echo "$ok of 20 logins succeeded across 2 auth replicas"
          [ "$ok" = "20" ] || { echo "::error::the replicas are not sharing state"; exit 1; }
          kubectl -n "$NS" delete pod apiprobe --ignore-not-found >/dev/null

      - name: The suite passes against it
        run: |
          if ! kubectl -n "$NS" wait --for=condition=complete --timeout=15m job/pgenv-test-env-shards-r1; then
            echo "::error::the suite did not pass against Postgres"
            kubectl -n "$NS" logs -l app.kubernetes.io/component=api-tests --tail=60
            exit 1
          fi

      - name: Show what failed
        if: failure()
        run: |
          kubectl -n "$NS" get pods -o wide || true
          kubectl -n "$NS" describe statefulset pgenv-test-env-postgres || true
          kubectl -n "$NS" logs statefulset/pgenv-test-env-postgres --tail=40 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=db-migrate --tail=40 || true

      - name: Tear it down, and prove the volume went with it
        if: always()
        run: |
          # A StatefulSet's claim is the one piece of an environment that can
          # outlive it — volumeClaimTemplates are not garbage-collected with
          # the StatefulSet, only with the namespace. verify-teardown.sh looks
          # for released PersistentVolumes, which is where that would show.
          helm uninstall pgenv -n "$NS" --wait --timeout 3m || true
          kubectl delete namespace "$NS" --wait=true --timeout=5m || true
          ./scripts/verify-teardown.sh --namespace "$NS" --release pgenv

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name pgenv || true

  ephemeral-environment:
    name: Deploy, test, aggregate, tear down
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      IMAGE_NAMESPACE: ${{ needs.build.outputs.namespace }}
      SHARDS: ${{ inputs.shards || 4 }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the environment
        id: env
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            name="pr-${{ github.event.pull_request.number }}"
          else
            name="run-${{ github.run_id }}"
          fi
          echo "namespace=$name" >> "$GITHUB_OUTPUT"
          echo "release=$name"   >> "$GITHUB_OUTPUT"
          echo "Environment: $name"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ephemeral-test-envs
          # Two workers, so shard pods have somewhere else to go. On a
          # single-node cluster the property asserted below cannot fail, which
          # is exactly how the shared-volume backend survived to v1.0 without
          # anyone noticing it confined every shard to one machine.
          config: scripts/kind-multi-node.yaml
          wait: 180s

      - name: Put the images into the cluster
        uses: ./.github/actions/load-images
        with:
          cluster: ephemeral-test-envs
          registry: ${{ env.REGISTRY }}
          namespace: ${{ needs.build.outputs.namespace }}
          tag: ${{ needs.build.outputs.tag }}
          from-registry: ${{ env.CAN_WRITE }}

      - name: Deploy the environment
        run: |
          helm install "${{ steps.env.outputs.release }}" ./charts/test-env \
            --namespace "${{ steps.env.outputs.namespace }}" --create-namespace \
            --values charts/test-env/values-ci.yaml \
            --set "image.registry=${REGISTRY}" \
            --set "image.namespace=${IMAGE_NAMESPACE}" \
            --set "image.tag=${IMAGE_TAG}" \
            --set "image.pullPolicy=Never" \
            --set "tests.shards=${SHARDS}" \
            --wait --timeout 6m

      - name: Wait for the application to be ready
        run: |
          kubectl -n "${{ steps.env.outputs.namespace }}" \
            wait --for=condition=available --timeout=5m deployment --all
          kubectl -n "${{ steps.env.outputs.namespace }}" get pods -o wide

      - name: Run the sharded suite
        id: tests
        continue-on-error: true
        run: |
          ns="${{ steps.env.outputs.namespace }}"
          job="${{ steps.env.outputs.release }}-test-env-shards-r1"

          # Wait for either outcome, so a failing suite still reaches
          # aggregation, reporting and teardown.
          if kubectl -n "$ns" wait --for=condition=complete --timeout=20m "job/$job"; then
            status=0
          else
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

          for index in $(seq 0 $((SHARDS - 1))); do
            echo "::group::shard $index"
            kubectl -n "$ns" logs \
              -l "batch.kubernetes.io/job-name=$job,batch.kubernetes.io/job-completion-index=$index" \
              --tail=100 || echo "(no logs for shard $index)"
            echo "::endgroup::"
          done

      - name: The quota actually refuses something
        run: |
          # A ResourceQuota that is merely present proves nothing. This asks the
          # API server to admit a pod far larger than the environment's ceiling
          # and requires it to say no — the difference between a namespace that
          # is bounded and one that has a bounded-looking object in it.
          ns="${{ steps.env.outputs.namespace }}"

          kubectl -n "$ns" describe resourcequota | sed -n '/Resource/,$p'

          if kubectl -n "$ns" run quota-probe --image=busybox:1.36 --restart=Never \
              --overrides='{"spec":{"containers":[{"name":"p","image":"busybox:1.36","command":["true"],"resources":{"requests":{"cpu":"64","memory":"64Mi"},"limits":{"cpu":"64","memory":"64Mi"}}}]}}' \
              >/dev/null 2>&1; then
            echo "::error::the namespace accepted a 64-core pod — the quota is not being enforced"
            kubectl -n "$ns" delete pod quota-probe --ignore-not-found
            exit 1
          fi
          echo "confirmed: a pod beyond the ceiling is refused"

          # And a pod that declares nothing must be given defaults rather than
          # rejected, which is the LimitRange's entire job.
          kubectl -n "$ns" run limit-probe --image=busybox:1.36 --restart=Never --command -- true
          kubectl -n "$ns" get pod limit-probe \
            -o jsonpath='{.spec.containers[0].resources}{"\n"}'
          kubectl -n "$ns" delete pod limit-probe --ignore-not-found >/dev/null

      - name: The shards actually spread across the cluster
        run: |
          # The acceptance test for #82, and the reason this job runs on a
          # multi-node cluster at all.
          #
          # It is deliberately not "the suite passed on more than one node" —
          # it always did. A ReadWriteOnce volume carries node affinity, so
          # every pod mounting it is scheduled onto the one node it attached
          # to. The run stays green and the parallelism quietly collapses onto
          # a single machine, which is worse than a failure because nothing
          # says so.
          #
          # The threshold used to be "more than one node", which is as much as
          # could be claimed while the spread was the scheduler's choice rather
          # than the chart's. A dispatch at tests.shards=2 put both shards on
          # one of two healthy workers and failed it — the assertion was
          # testing luck. With topologySpreadConstraints the distribution is
          # bounded, so the expected figure is exact.
          ns="${{ steps.env.outputs.namespace }}"
          job="${{ steps.env.outputs.release }}-test-env-shards-r1"

          # `grep -c` exits 1 on no matches, which `bash -e` would treat as a
          # step failure, so every count is guarded.
          nodes=$(kubectl -n "$ns" get pods \
            -l "batch.kubernetes.io/job-name=$job" \
            -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' \
            | sort -u | grep -c . || true)

          # A node counts as capacity only if it is Ready and carries no
          # NoSchedule taint — which is also exactly what nodeTaintsPolicy:
          # Honor makes the scheduler count as a domain. kubectl's jsonpath
          # has no negation, so the filtering happens in awk.
          schedulable=$(kubectl get nodes \
            -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{" "}{.spec.taints[*].effect}{"\n"}{end}' \
            | awk '$1 == "True" && $0 !~ /NoSchedule/ { n++ } END { print n + 0 }')

          # maxSkew 1 across `schedulable` domains means the shards cover
          # every domain until there are fewer shards than domains.
          expected=$(( SHARDS < schedulable ? SHARDS : schedulable ))

          kubectl -n "$ns" get pods -l "batch.kubernetes.io/job-name=$job" \
            -o custom-columns='POD:.metadata.name,NODE:.spec.nodeName' --no-headers

          echo "$SHARDS shard pod(s) ran on $nodes node(s); $schedulable schedulable, $expected expected"

          if [ "$nodes" -lt "$expected" ]; then
            echo "::error::the shards covered $nodes node(s) where $expected were available to them"
            kubectl -n "$ns" get job "$job" \
              -o jsonpath='{.spec.template.spec.topologySpreadConstraints}{"\n"}'
            exit 1
          fi
          printf '| Shard spread | %s of %s schedulable nodes |\n' "$nodes" "$schedulable" >> "$GITHUB_STEP_SUMMARY"

      - name: Aggregate results
        continue-on-error: true
        run: |
          ns="${{ steps.env.outputs.namespace }}"
          job="${{ steps.env.outputs.release }}-test-env-aggregate-r1"
          kubectl -n "$ns" wait --for=condition=complete --timeout=6m "job/$job" || true
          kubectl -n "$ns" logs "job/$job" --tail=200 || true

      - name: Build the results tooling
        run: |
          # fetch-results.sh talks to the bucket through the compiled sync CLI.
          # Nothing else in this job needs node, which is why this was missing —
          # and why the collection below failed silently for four pull requests.
          npm --prefix scripts ci
          npm --prefix scripts run build

      - name: Copy results out of the cluster
        id: collect
        continue-on-error: true
        run: |
          ./scripts/fetch-results.sh \
            --namespace "${{ steps.env.outputs.namespace }}" \
            --release "${{ steps.env.outputs.release }}" \
            --output ./results

      - name: Regenerate the shard weights from this run
        if: always()
        continue-on-error: true
        run: |
          # Published rather than committed: the ruleset does not allow pushing
          # to main, and it should not. This makes the current truth one
          # download away from whoever wants to apply it.
          #
          # Taken from CI rather than a laptop on purpose — these are the
          # machines the weights have to be right about.
          node scripts/dist/update-weights.js \
            --weights tests/api/test-weights.json \
            --input results/merged/allure-results \
            --dry-run | tee /tmp/weights.txt || true

          if [ -s /tmp/weights.txt ]; then
            {
              echo '<details><summary>Shard weights measured by this run</summary>'
              echo
              echo '```'
              cat /tmp/weights.txt
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the run summary
        if: always()
        run: |
          if [ -f ./results/merged/summary.md ]; then
            cat ./results/merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No aggregated summary was produced" >> "$GITHUB_STEP_SUMMARY"
            echo "The shard Job or the aggregator did not complete — see the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate the Allure report
        if: always()
        continue-on-error: true
        run: |
          # Rendered here rather than in-cluster: `allure generate` needs a JRE,
          # and the runner already has one. See docs/adr/0004-*.md.
          if [ -d ./results/merged/allure-results ]; then
            npx --yes allure-commandline@2 generate ./results/merged/allure-results \
              --clean -o ./results/allure-report
          fi

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ steps.env.outputs.namespace }}
          path: |
            results/merged/summary.json
            results/merged/summary.md
            results/merged/allure-results
            results/allure-report
          if-no-files-found: warn
          retention-days: 14

      # Writing a comment needs a write token, which a fork pull request does
      # not get. The same report is in the job summary above either way — the
      # comment is a convenience, not the delivery.
      - name: Comment the summary on the pull request
        if: always() && github.event_name == 'pull_request' && env.CAN_WRITE == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = './results/merged/summary.md';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '### The ephemeral environment produced no test summary\nSee the workflow logs.';

            const marker = '<!-- ephemeral-test-envs-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            const payload = `${marker}\n${body}`;

            // Updated in place, so a PR with ten pushes has one summary, not ten.
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload,
              });
            }

      # --------------------------------------------------------------- teardown --
      # Everything below runs even if any step above failed or the job was
      # cancelled. This is what makes "ephemeral" true rather than aspirational.

      - name: Tear down the environment
        if: always() && !inputs.keep_environment
        run: |
          ns="${{ steps.env.outputs.namespace }}"
          # Each command tolerates the previous one failing: the verification
          # step below is what decides whether cleanup actually worked.
          helm uninstall "${{ steps.env.outputs.release }}" -n "$ns" --wait --timeout 3m || true
          kubectl delete namespace "$ns" --wait=true --timeout=5m || true

      - name: Prove the environment is gone
        if: always() && !inputs.keep_environment
        run: |
          # Not a formality: this is the claim the whole project makes, so it is
          # asserted rather than assumed. A leftover namespace, a cluster-scoped
          # RBAC object or a released PersistentVolume fails the build.
          ./scripts/verify-teardown.sh \
            --namespace "${{ steps.env.outputs.namespace }}" \
            --release "${{ steps.env.outputs.release }}"

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name ephemeral-test-envs || true

      - name: The report was actually collected
        if: always() && !inputs.keep_environment
        run: |
          # `continue-on-error` above exists so teardown still runs. It also
          # means a broken collection step reports success, which is how the
          # report quietly stopped being published between #95 and #99. The
          # verdict is taken here instead, after the environment is gone.
          if [ ! -f ./results/merged/summary.md ]; then
            echo "::error::the merged report was not collected from the environment"
            exit 1
          fi
          echo "collected $(find ./results/merged/allure-results -type f | wc -l) result file(s)"

      - name: Fail the build if any test failed
        if: always()
        run: |
          # Deliberately last: the report is published and the environment is
          # destroyed before the run is allowed to go red.
          if [ "${{ steps.tests.outputs.status }}" != "0" ]; then
            echo "::error::The sharded test suite reported failures."
            exit 1
          fi
          echo "All shards passed."
