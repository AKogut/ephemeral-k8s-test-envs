name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    name: Queue minor, patch and digest updates to merge once CI is green
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Queue the merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave a major version for a person
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create major-update --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "A major version, merged by a person rather than automatically" --force
          gh pr edit "$PR_URL" --add-label major-update
